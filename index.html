<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¿Quién es más probable?</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#170d24;--card:#261638;--line:#3b2556;--bone:#f4ecdc;--mute:#a995c4;--pump:#ff7a1a;--slime:#a6f26b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--bone);font:800 17px/1.35 Nunito,system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
h1{font:400 34px/1.05 Bungee,Impact,sans-serif;margin:28px 0 6px;color:var(--pump)}
h1 b{color:var(--bone)}
.sub,.mute{color:var(--mute);font-weight:600}
input{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--bone);font:inherit}
input:focus{outline:3px solid var(--pump);border-color:var(--pump)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px 16px;background:var(--line);color:var(--bone);width:100%;margin:6px 0}
button:focus-visible{outline:3px solid var(--bone)}
button.pri{background:var(--pump);color:#1b0d00;font-size:19px}
button:disabled{opacity:.4}
.row{display:flex;gap:8px}.row>*{flex:1}.row input{flex:2}
.or{text-align:center;color:var(--mute);margin:14px 0 4px;font-weight:600}
.err{color:#ff8f8f;min-height:1.4em}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-weight:600;margin-bottom:10px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:4px 12px;color:var(--bone)}
.q{font:400 27px/1.15 Bungee,Impact,sans-serif;margin:12px 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);text-align:left;padding:10px 12px;margin:0}
.opt .n,.badge{font:400 26px Bungee,Impact,sans-serif;color:var(--pump);min-width:34px;text-align:center}
.opt.on{border-color:var(--slime);background:#24381b}.opt.on .n{color:var(--slime)}
.opt span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.players{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.players .chip b{color:var(--pump);font-family:Bungee,Impact,sans-serif;font-weight:400;margin-right:6px}
.qr{background:#fff;border-radius:14px;padding:8px;width:210px;margin:14px auto}
.qr svg{display:block;width:100%;height:auto}
.code{font:400 44px Bungee,Impact,sans-serif;text-align:center;letter-spacing:6px;color:var(--bone)}
.win{background:var(--slime);color:#10200a;border-radius:16px;padding:16px;text-align:center;margin:12px 0 18px}
.win .big{font:400 34px/1.1 Bungee,Impact,sans-serif}
.bar{display:grid;grid-template-columns:36px 1fr 30px;gap:10px;align-items:center;margin:8px 0}
.bar .t{background:var(--card);border-radius:8px;height:30px;overflow:hidden;position:relative}
.bar .f{background:var(--pump);height:100%;min-width:4px}
.bar .t span{position:absolute;left:10px;top:3px;font-weight:800;text-shadow:0 1px 2px #000}
.bar .v{font:400 20px Bungee,Impact,sans-serif;text-align:right}
.rank{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.win{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.9);opacity:0}}}

#bg{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;pointer-events:none;z-index:0}
#bg i{position:absolute;bottom:-60px;font-style:normal;opacity:.18;animation:rise linear infinite}
#app{position:relative;z-index:1}
.fx{position:fixed;top:-40px;z-index:5;pointer-events:none;font-size:28px;animation:fall 2.6s ease-in forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg)}}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg);opacity:.8}}
@keyframes wob{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 #ff7a1a66}50%{box-shadow:0 0 22px 4px #ff7a1a88}}
@keyframes slide{from{transform:translateY(18px);opacity:0}}
@keyframes grow{from{width:0}}
@keyframes bump{from{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.opt:not(:disabled):active{transform:scale(.94)}
.opt{transition:transform .12s,border-color .15s,background .15s}
.opt:disabled{opacity:.35}
@media (prefers-reduced-motion:no-preference){
h1{animation:wob 3.2s ease-in-out infinite;transform-origin:left center}
button.pri:not(:disabled){animation:glow 2.2s ease-in-out infinite}
.enter .q{animation:slide .4s ease-out}
.enter .opt,.enter .players .chip,.enter .rank{animation:bump .4s ease-out backwards}
.enter .opt:nth-child(2),.enter .chip:nth-child(2),.enter .rank:nth-child(2){animation-delay:.05s}
.enter .opt:nth-child(3),.enter .chip:nth-child(3),.enter .rank:nth-child(3){animation-delay:.1s}
.enter .opt:nth-child(4),.enter .chip:nth-child(4),.enter .rank:nth-child(4){animation-delay:.15s}
.enter .opt:nth-child(n+5),.enter .chip:nth-child(n+5),.enter .rank:nth-child(n+5){animation-delay:.2s}
.enter .bar .f{animation:grow .9s cubic-bezier(.2,.8,.2,1) backwards .3s}
.enter .win{animation:bump .6s ease-out .2s backwards}
.enter .code{animation:bump .5s ease-out}
.err:not(:empty){animation:shake .3s}
}
@media (prefers-reduced-motion:reduce){#bg,.fx{display:none}}
body[data-mode=fuerte]{--pump:#ff3d5a;--line:#4a2040}
button.pri{margin:8px 0}
.cfg{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin:16px 0 8px}
.seg{display:flex;gap:8px;margin-bottom:8px}.seg button{margin:0;padding:10px 6px}
.seg .on{background:var(--pump);color:#1b0d00}
.stp{display:flex;align-items:center;gap:10px;margin:6px 0}.stp span{flex:1}.stp b{min-width:80px;text-align:center}
.stp button{width:44px;margin:0;padding:8px}
.tbar{height:10px;border-radius:9px;background:var(--card);overflow:hidden;margin:6px 0 4px}.tbar i{display:block;height:100%;width:100%;background:var(--pump)}
#tm{text-align:center;margin-bottom:12px}
h2{font:400 21px/1.2 Bungee,Impact,sans-serif;margin:22px 0 8px}h2 small{display:block;color:var(--mute);font:600 15px Nunito,sans-serif}
.mine{background:var(--card);border-left:5px solid var(--pump);border-radius:10px;padding:10px 12px;margin:0 0 14px}
.vs{color:var(--mute);font-weight:600;font-size:14px;margin:-4px 0 8px 46px}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app"></div>
<script src="preguntas.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
if(typeof Q==='undefined'){document.getElementById('app').innerHTML='<h1>Falta <b>preguntas.js</b></h1><p class="sub">Sube preguntas.js al mismo sitio que index.html.</p>';throw new Error('sin preguntas')}
// ---------- Utilidades ----------
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const pid=ls.get('pid')||(()=>{const p=Math.random().toString(36).slice(2,10);ls.set('pid',p);return p})();
const OPTS={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'},{urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'},{urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turns:openrelay.metered.ca:443'],username:'openrelayproject',credential:'openrelayproject'}]}};
let wl;async function keepAwake(){try{if(navigator.wakeLock&&document.visibilityState==='visible')wl=await navigator.wakeLock.request('screen')}catch(e){}}
let myName=ls.get('name')||'',isHost=false,code='',peer,conn,conns={},H=null,S=null,me=null,myVote=null,err='',cq='',deck=[],busy=false;
const hashCode=()=>(location.hash||'').replace('#','').toUpperCase().slice(0,4);

// ---------- Anfitrión ----------
const TIMES=[0,10,15,20,30,45,60,90];
let decks={colegueo:[],fuerte:[]};
function createGame(){
  if(typeof Peer==='undefined'){err='No se pudo cargar PeerJS (¿sin internet o bloqueado?).';return render()}
  isHost=true;busy=true;err='';render();keepAwake();
  const c=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
  peer=new Peer('hq-'+c,OPTS);
  peer.on('open',()=>{code=c;busy=false;H={cfg:{mode:'colegueo',target:10,secs:30},phase:'lobby',round:0,q:'',votes:{},res:null,deadline:0,champ:null,players:[{id:pid,n:1,name:myName,total:0,wins:0}]};me=1;bc();setInterval(()=>{if(H&&H.phase==='vote'&&H.deadline&&Date.now()>=H.deadline)reveal()},500)});
  peer.on('disconnected',()=>{try{if(!peer.destroyed)peer.reconnect()}catch(e){}});
  peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();createGame()}else if(!H){busy=false;isHost=false;err='No se pudo crear la partida ['+e.type+']. Revisa tu conexión.';render()}});
  peer.on('connection',c=>{
    c.on('data',m=>{
      if(m.t==='join'&&m.pid){
        let p=H.players.find(x=>x.id===m.pid);
        if(!p){p={id:m.pid,n:H.players.length+1,name:String(m.name||'?').slice(0,14),total:0,wins:0};H.players.push(p)}
        conns[m.pid]=c;c._pid=m.pid;bc();
      }else if(m.t==='vote'&&H.phase==='vote'&&c._pid)castVote(c._pid,m.n);
    });
  });
}
const pub=()=>({cfg:H.cfg,phase:H.phase,round:H.round,q:H.q,res:H.res,code,champ:H.champ,timed:!!H.deadline,left:H.deadline?Math.max(0,H.deadline-Date.now()):0,voted:Object.keys(H.votes).length,players:H.players.map(p=>({n:p.n,name:p.name,total:p.total,wins:p.wins}))});
function bc(){S=pub();S.endAt=H.deadline;for(const id in conns){const c=conns[id];if(c&&c.open){const p=H.players.find(x=>x.id===id);c.send({t:'s',s:S,you:p&&p.n,voted:H.votes[id]!=null?H.votes[id]:null})}}myVote=H.votes[pid]!=null?H.votes[pid]:null;render()}
let bt=0;function bcSoon(){if(bt)return;bt=setTimeout(()=>{bt=0;bc()},150)}
function castVote(id,n){
  const v=H.players.find(p=>p.id===id);
  if(H.phase!=='vote'||!v||v.n===n||!H.players.some(p=>p.n===n))return;
  H.votes[id]=n;bcSoon();
  if(H.players.length>1&&Object.keys(H.votes).length>=H.players.length)setTimeout(reveal,900);
}
function nextQ(){
  const m=H.cfg.mode;
  if(!decks[m].length)decks[m]=Q[m].map(q=>[Math.random(),q]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  H.q=cq.trim()||decks[m].pop();cq='';
  H.round++;H.votes={};H.res=null;H.phase='vote';
  H.deadline=H.cfg.secs?Date.now()+H.cfg.secs*1000:0;bc();botVotes();
}
function botVotes(){
  const r=H.round;
  H.players.filter(p=>p.bot).forEach(b=>setTimeout(()=>{
    if(!H||H.phase!=='vote'||H.round!==r)return;
    const o=H.players.filter(p=>p.id!==b.id);castVote(b.id,o[Math.random()*o.length|0].n)
  },1000+Math.random()*8000));
}
function toggleBots(){
  if(H.players.some(p=>p.bot)){H.players=H.players.filter(p=>!p.bot);H.players.forEach((p,i)=>p.n=i+1)}
  else while(H.players.length<15){const i=H.players.length+1;H.players.push({id:'bot'+i,n:i,name:'Bot'+i,total:0,wins:0,bot:true})}
  bc();
}
function skipQ(){H.round--;nextQ()}
function reveal(){
  if(!H||H.phase!=='vote')return;
  const counts={},voters={};
  for(const id in H.votes){const t=H.votes[id],v=H.players.find(p=>p.id===id);counts[t]=(counts[t]||0)+1;(voters[t]=voters[t]||[]).push(v?v.n:0)}
  const max=Math.max(0,...Object.values(counts));
  const winners=max?H.players.filter(p=>counts[p.n]===max).map(p=>p.n):[];
  H.players.forEach(p=>{p.total+=counts[p.n]||0;if(winners.includes(p.n))p.wins++});
  H.res={counts,voters,max,winners};H.deadline=0;
  const ch=H.players.filter(p=>p.wins>=H.cfg.target),top=Math.max(0,...ch.map(p=>p.wins));
  H.champ=ch.length?ch.filter(p=>p.wins===top).map(p=>p.n):null;
  H.phase='result';bc();
}
function resetGame(){H.players.forEach(p=>{p.total=0;p.wins=0});H.round=0;H.champ=null;H.res=null;H.votes={};H.phase='lobby';bc()}

// ---------- Jugador ----------
let stage='';
function setStage(t){stage=t;if(busy&&!S)render()}
function joinGame(c,retry){
  if(typeof Peer==='undefined'){err='No se pudo cargar PeerJS (¿sin internet o bloqueado?).';return render()}
  code=c;busy=true;err='';stage='1/3 servidor';render();keepAwake();
  try{peer&&peer.destroy()}catch(e){}
  let opened=false,done=false,to;
  const fail=async()=>{
    if(done)return;done=true;
    if(S){setTimeout(()=>joinGame(c),3000);return}
    if(!retry&&!opened){return joinGame(c,true)}
    let reach='no';try{await fetch('https://0.peerjs.com/',{mode:'no-cors',cache:'no-store'});reach='sí'}catch(e){}
    const st=conn&&conn.peerConnection?conn.peerConnection.iceConnectionState:'-';
    err=opened?'Llego al servidor pero no al anfitrión ['+st+']. Prueba con otra red (datos o wifi).':'No llego al servidor de conexión [servidor accesible: '+reach+']. Abre el enlace en Chrome y desactiva DNS privado o bloqueadores.';
    busy=false;render();
  };
  to=setTimeout(fail,9000);
  peer=new Peer(OPTS);
  peer.on('open',()=>{
    opened=true;setStage('2/3 buscando partida');
    conn=peer.connect('hq-'+code,{reliable:true});
    conn.on('open',()=>{setStage('3/3 entrando');conn.send({t:'join',pid,name:myName})});
    conn.on('data',m=>{if(m.t==='s'){clearTimeout(to);done=true;busy=false;S=m.s;if(S.timed)S.endAt=Date.now()+S.left;me=m.you;myVote=m.voted;render()}});
    conn.on('close',()=>{if(S&&!done)return;if(S)setTimeout(()=>joinGame(code),1500)});
  });
  peer.on('error',e=>{
    if(done)return;clearTimeout(to);done=true;
    if(S){setTimeout(()=>joinGame(c),3000);return}
    err=e.type==='peer-unavailable'?'No existe la partida '+code+'. Revisa el código.':'Problema de conexión ['+e.type+'].';busy=false;render();
  });
}
function vote(n){
  if(n===me)return;
  if(isHost)castVote(pid,n);
  else if(conn&&conn.open){conn.send({t:'vote',n});myVote=n;render()}
}

// ---------- Pantallas ----------
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
let lastKey='';
function enter(k){app.classList.toggle('enter',k!==lastKey);lastKey=k}
function burst(list){if(RM)return;for(let i=0;i<26;i++){const e=document.createElement('span');e.className='fx';e.textContent=list[i%list.length];e.style.left=Math.random()*96+'vw';e.style.animationDelay=Math.random()*.9+'s';e.style.fontSize=(22+Math.random()*18)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),4200)}}
(function(){const bg=$('#bg'),em=['🎃','👻','🦇','💀','🕸️','🕯️'];for(let i=0;i<14;i++){const e=document.createElement('i');e.textContent=em[i%em.length];e.style.left=(i*7.3+Math.random()*5)%96+'vw';e.style.fontSize=(24+Math.random()*26)+'px';e.style.animationDuration=(14+Math.random()*14)+'s';e.style.animationDelay=(-Math.random()*20)+'s';bg.appendChild(e)}})();
const MODE=m=>m==='fuerte'?'🌶️ Fuerte':'😄 Colegueo';
function cfgPanel(){
  const c=S.cfg,seg=m=>`<button class="${c.mode===m?'on':''}" data-a="mode" data-m="${m}">${MODE(m)}</button>`;
  const stp=(l,k,v)=>`<div class="stp"><span>${l}</span><button data-a="${k}" data-d="-1">−</button><b>${v}</b><button data-a="${k}" data-d="1">+</button></div>`;
  return `<div class="cfg"><div class="seg">${seg('colegueo')}${seg('fuerte')}</div>${stp('Rondas para ganar','tg',c.target)}${stp('Tiempo por pregunta','sc',c.secs?c.secs+' s':'sin límite')}</div>`;
}
function render(){
  if(!S){
    const hc=hashCode();
    app.innerHTML=`<h1>¿Quién es más <b>probable</b>?</h1><p class="sub">El juego de Halloween. Cada uno vota desde su móvil.</p>
    <input id="nm" placeholder="Tu nombre" maxlength="14" value="${esc(myName)}" autocomplete="off">
    ${busy?`<p class="mute">Conectando… ${esc(stage)}</p>`:hc.length===4
      ?`<button class="pri" data-a="join" data-c="${esc(hc)}">Unirme a la partida ${esc(hc)}</button>`
      :`<button class="pri" data-a="create">Crear partida</button><div class="or">o entra con un código</div><div class="row"><input id="cd" maxlength="4" placeholder="CÓDIGO" autocomplete="off"><button data-a="join">Unirme</button></div>`}
    <p class="err">${esc(err)}</p>`;
    document.body.dataset.mode='';enter('home'+busy+err);
    return;
  }
  const ps=S.players,total=ps.length,cf=S.cfg,nm=n=>esc((ps.find(p=>p.n===n)||{}).name||'?');
  const lead=[...ps].sort((a,b)=>b.total-a.total||b.wins-a.wins);
  document.body.dataset.mode=cf.mode;
  const chips=ps.map(p=>`<span class="chip"><b>${p.n}</b>${esc(p.name)}${p.n===me?' (tú)':''}</span>`).join('');
  let h=`<div class="top"><span>${S.round?'Ronda '+S.round:'Sala de espera'}</span><span class="chip">${MODE(cf.mode)} · ${S.code}</span></div>`;
  if(S.phase==='lobby'){
    const url=location.href.split('#')[0]+'#'+S.code;
    h+=`<h1>Tu número es el <b>${me||'…'}</b></h1>`;
    if(isHost){
      let q='';try{const g=qrcode(0,'M');g.addData(url);g.make();q=g.createSvgTag({cellSize:4,margin:1,scalable:true})}catch(e){}
      h+=`<p class="sub">Que escaneen el QR o entren con el código:</p>${q?`<div class="qr">${q}</div>`:''}<div class="code">${S.code}</div><p class="mute" style="text-align:center;word-break:break-all">${esc(url)}</p>`;
    }else h+=`<p class="sub">Esperando a que el anfitrión empiece…</p><p class="mute">Gana quien consiga ${cf.target} rondas · ${cf.secs?cf.secs+' s por pregunta':'sin límite de tiempo'}</p>`;
    h+=`<div class="players">${chips}</div>`;
    if(isHost)h+=cfgPanel()+`<button class="pri" data-a="next" ${total<2?'disabled':''}>Empezar (${total} jugadores)</button><button data-a="bots">${ps.length&&H.players.some(p=>p.bot)?'Quitar bots de prueba':'🤖 Rellenar con bots de prueba (hasta 15)'}</button>`;
  }else if(S.phase==='vote'){
    h+=`<div class="q" style="font-size:${S.q.length>100?17:S.q.length>70?21:27}px">${esc(S.q)}</div>`;
    if(S.timed)h+=`<div class="tbar"><i id="tb"></i></div><div id="tm" class="mute"></div>`;
    h+=`<div class="grid">${ps.map(p=>`<button class="opt ${myVote===p.n?'on':''}" data-a="vote" data-n="${p.n}" ${p.n===me?'disabled':''}><span class="n">${p.n}</span><span>${esc(p.name)}${p.n===me?' (tú)':''}</span></button>`).join('')}</div>
    <p class="mute" style="text-align:center">${myVote?'Voto enviado. Puedes cambiarlo hasta que se revele.':'Toca el número de la persona que elijas (a ti no puedes votarte).'}<br>${S.voted} de ${total} han votado</p>`;
    if(isHost)h+=`<button class="pri" data-a="reveal">Finalizar y ver resultados</button><button data-a="skip">Saltar pregunta (no cuenta)</button>`;
  }else if(S.phase==='result'){
    const r=S.res,v=n=>r.voters[n]||[],ct=n=>r.counts[n]||0,mine=v(me);
    const sorted=[...ps].sort((a,b)=>ct(b.n)-ct(a.n));
    h+=`<div class="mute">${esc(S.q)}</div>`;
    h+=r.max?`<div class="win"><div class="big">${r.winners.map(n=>n+' · '+nm(n)).join('<br>')}</div>${r.winners.length>1?'Empate':'Gana la ronda'} con ${r.max} ${r.max>1?'votos':'voto'}</div>`:`<div class="win"><div class="big">Nadie votó</div></div>`;
    h+=`<div class="mine">${mine.length?`Te han votado <b>${mine.length}</b>: ${mine.map(nm).join(', ')}`:'Nadie te ha votado esta ronda'}</div>`;
    h+=sorted.map(p=>`<div class="bar"><span class="badge">${p.n}</span><div class="t"><div class="f" style="width:${r.max?ct(p.n)/r.max*100:0}%"></div><span>${esc(p.name)}</span></div><span class="v">${ct(p.n)}</span></div>${ct(p.n)?`<div class="vs">Votado por ${v(p.n).map(nm).join(', ')}</div>`:''}`).join('');
    h+=`<h2>👑 Va ganando: ${esc(lead[0].name)} <small>${lead[0].total} votos en total</small></h2>`;
    h+=lead.map(p=>`<div class="rank"><span class="badge">${p.n}</span><span>${esc(p.name)}</span><span class="mute">${p.total} votos · 🏆 ${p.wins}/${cf.target}</span></div>`).join('');
    if(S.champ)h+=`<div class="win" style="margin-top:16px"><div class="big">🏆 ${S.champ.map(nm).join(' y ')}</div>${S.champ.length>1?'llegan':'llega'} a ${cf.target} rondas ganadas</div>`;
    if(isHost){
      if(S.champ)h+=`<button class="pri" data-a="end">Terminar partida</button>`;
      else h+=cfgPanel()+`<input id="cq" placeholder="Tu propia pregunta (opcional)" value="${esc(cq)}"><button class="pri" data-a="next">Siguiente pregunta</button><button data-a="end">Terminar partida</button>`;
    }else h+=`<p class="mute" style="text-align:center">${S.champ?'Fin de la partida…':'Esperando la siguiente pregunta…'}</p>`;
  }else{
    const win=(S.champ&&S.champ.length?S.champ:[ [...ps].sort((a,b)=>b.wins-a.wins||b.total-a.total)[0].n ]);
    h+=`<div class="win"><div class="big">🏆 ${win.map(nm).join(' y ')}</div>${win.length>1?'ganan':'gana'} la partida</div><h2>Clasificación final</h2>`;
    h+=[...ps].sort((a,b)=>b.wins-a.wins||b.total-a.total).map(p=>`<div class="rank"><span class="badge">${p.n}</span><span>${esc(p.name)}</span><span class="mute">🏆 ${p.wins} · ${p.total} votos</span></div>`).join('');
    if(isHost)h+=`<button class="pri" data-a="again" style="margin-top:16px">Nueva partida (mismos jugadores)</button>`;
  }
  app.innerHTML=h;
  const k=S.phase+S.round;
  enter(k);
  if((S.phase==='result'||S.phase==='end')&&(S.champ||S.phase==='result')&&k!==lastBurst){lastBurst=k;burst(S.champ?['🏆','🎃','👻','🦇','💀']:['🎃','👻','🦇','💀'])}
}
let lastBurst='';
setInterval(()=>{
  if(!S||S.phase!=='vote'||!S.timed)return;
  const tm=$('#tm'),tb=$('#tb');if(!tm)return;
  const l=Math.max(0,(S.endAt||0)-Date.now());
  tm.textContent='⏱ '+Math.ceil(l/1000)+' s';tb.style.width=(S.cfg.secs?l/(S.cfg.secs*1000)*100:0)+'%';
},250);
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,nmI=$('#nm');
  if(nmI){myName=nmI.value.trim().slice(0,14);ls.set('name',myName)}
  if(a==='create'||a==='join'){
    if(!myName){err='Escribe tu nombre primero.';return render()}
    if(a==='create')return createGame();
    const c=(b.dataset.c||($('#cd')||{}).value||'').trim().toUpperCase();
    if(c.length!==4){err='El código tiene 4 letras.';return render()}
    return joinGame(c);
  }
  if(a==='vote')return vote(+b.dataset.n);
  if(!isHost||!H)return;
  const d=+b.dataset.d;
  if(a==='next')nextQ();
  else if(a==='reveal')reveal();
  else if(a==='skip')skipQ();
  else if(a==='end'){H.phase='end';H.deadline=0;bc()}
  else if(a==='again')resetGame();
  else if(a==='bots')toggleBots();
  else if(a==='mode'){H.cfg.mode=b.dataset.m;bc()}
  else if(a==='tg'){H.cfg.target=Math.min(30,Math.max(1,H.cfg.target+d));bc()}
  else if(a==='sc'){const i=TIMES.indexOf(H.cfg.secs);H.cfg.secs=TIMES[Math.min(TIMES.length-1,Math.max(0,i+d))];bc()}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;keepAwake();if(isHost){if(peer&&peer.disconnected&&!peer.destroyed)try{peer.reconnect()}catch(e){}}else if(S&&(!conn||!conn.open))joinGame(code)});
app.addEventListener('input',e=>{if(e.target.id==='cq')cq=e.target.value});
render();
</script>
</body>
</html>
