<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¿Quién es más probable?</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#170d24;--card:#261638;--line:#3b2556;--bone:#f4ecdc;--mute:#a995c4;--pump:#ff7a1a;--slime:#a6f26b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--bone);font:800 17px/1.35 Nunito,system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
h1{font:400 34px/1.05 Bungee,Impact,sans-serif;margin:28px 0 6px;color:var(--pump)}
h1 b{color:var(--bone)}
.sub,.mute{color:var(--mute);font-weight:600}
input{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--bone);font:inherit}
input:focus{outline:3px solid var(--pump);border-color:var(--pump)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px 16px;background:var(--line);color:var(--bone);width:100%;margin:6px 0}
button:focus-visible{outline:3px solid var(--bone)}
button.pri{background:var(--pump);color:#1b0d00;font-size:19px}
button:disabled{opacity:.4}
.row{display:flex;gap:8px}.row>*{flex:1}.row input{flex:2}
.or{text-align:center;color:var(--mute);margin:14px 0 4px;font-weight:600}
.err{color:#ff8f8f;min-height:1.4em}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-weight:600;margin-bottom:10px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:4px 12px;color:var(--bone)}
.q{font:400 27px/1.15 Bungee,Impact,sans-serif;margin:12px 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);text-align:left;padding:10px 12px;margin:0}
.opt .n,.badge{font:400 26px Bungee,Impact,sans-serif;color:var(--pump);min-width:34px;text-align:center}
.opt.on{border-color:var(--slime);background:#24381b}.opt.on .n{color:var(--slime)}
.opt span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.players{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.players .chip b{color:var(--pump);font-family:Bungee,Impact,sans-serif;font-weight:400;margin-right:6px}
.qr{background:#fff;border-radius:14px;padding:8px;width:210px;margin:14px auto}
.qr svg{display:block;width:100%;height:auto}
.code{font:400 44px Bungee,Impact,sans-serif;text-align:center;letter-spacing:6px;color:var(--bone)}
.win{background:var(--slime);color:#10200a;border-radius:16px;padding:16px;text-align:center;margin:12px 0 18px}
.win .big{font:400 34px/1.1 Bungee,Impact,sans-serif}
.bar{display:grid;grid-template-columns:36px 1fr 30px;gap:10px;align-items:center;margin:8px 0}
.bar .t{background:var(--card);border-radius:8px;height:30px;overflow:hidden;position:relative}
.bar .f{background:var(--pump);height:100%;min-width:4px}
.bar .t span{position:absolute;left:10px;top:3px;font-weight:800;text-shadow:0 1px 2px #000}
.bar .v{font:400 20px Bungee,Impact,sans-serif;text-align:right}
.rank{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.win{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.9);opacity:0}}}

#bg{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;pointer-events:none;z-index:0}
#bg i{position:absolute;bottom:-60px;font-style:normal;opacity:.18;animation:rise linear infinite}
#app{position:relative;z-index:1}
.fx{position:fixed;top:-40px;z-index:5;pointer-events:none;font-size:28px;animation:fall 2.6s ease-in forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg)}}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg);opacity:.8}}
@keyframes wob{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 #ff7a1a66}50%{box-shadow:0 0 22px 4px #ff7a1a88}}
@keyframes slide{from{transform:translateY(18px);opacity:0}}
@keyframes grow{from{width:0}}
@keyframes bump{from{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.opt:not(:disabled):active{transform:scale(.94)}
.opt{transition:transform .12s,border-color .15s,background .15s}
.opt:disabled{opacity:.35}
@media (prefers-reduced-motion:no-preference){
h1{animation:wob 3.2s ease-in-out infinite;transform-origin:left center}
button.pri:not(:disabled){animation:glow 2.2s ease-in-out infinite}
.enter .q{animation:slide .4s ease-out}
.enter .opt,.enter .players .chip,.enter .rank{animation:bump .4s ease-out backwards}
.enter .opt:nth-child(2),.enter .chip:nth-child(2),.enter .rank:nth-child(2){animation-delay:.05s}
.enter .opt:nth-child(3),.enter .chip:nth-child(3),.enter .rank:nth-child(3){animation-delay:.1s}
.enter .opt:nth-child(4),.enter .chip:nth-child(4),.enter .rank:nth-child(4){animation-delay:.15s}
.enter .opt:nth-child(n+5),.enter .chip:nth-child(n+5),.enter .rank:nth-child(n+5){animation-delay:.2s}
.enter .bar .f{animation:grow .9s cubic-bezier(.2,.8,.2,1) backwards .3s}
.enter .win{animation:bump .6s ease-out .2s backwards}
.enter .code{animation:bump .5s ease-out}
.err:not(:empty){animation:shake .3s}
}
@media (prefers-reduced-motion:reduce){#bg,.fx{display:none}}
body[data-mode=fuerte]{--pump:#ff3d5a;--line:#4a2040}
button.pri{margin:8px 0}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
// ---------- Preguntas ----------
// Para añadir una: nueva línea entre comillas dobles "..." y una coma al final (menos la última de cada lista).
// Evita poner comillas dobles " dentro de la pregunta.
const Q={
colegueo:[
"¿Quién es más probable que se quede dormido en la fiesta?",
"¿Quién es más probable que se pierda yendo al baño?",
"¿Quién sobreviviría más tiempo a un apocalipsis zombi?",
"¿Quién sería el primero en morir en una película de terror?",
"¿Quién es más probable que llegue tarde a su propia boda?",
"¿Quién es más probable que baile encima de una mesa?",
"¿Quién es más probable que grite al ver una araña?",
"¿Quién es más probable que sea el último en irse de la fiesta?",
"¿Quién es más probable que se haga famoso?",
"¿Quién es más probable que cante en el karaoke sin que se lo pidan?",
"¿Quién es más probable que pida pizza a las 4 de la mañana?",
"¿Quién es más probable que tenga el móvil con la pantalla rota?",
"¿Quién es más probable que hable solo en voz alta?",
"¿Quién es más probable que acabe en urgencias por una tontería?",
"¿Quién es más probable que se gaste el sueldo en un viaje improvisado?",
"¿Quién es más probable que invente una excusa para irse antes?",
"¿Quién es más probable que haga un directo en TikTok esta noche?",
"¿Quién es más probable que se disfrace en pleno agosto?",
"¿Quién es más probable que sea un vampiro de verdad?",
"¿Quién es más probable que le dé miedo su propia sombra?",
"¿Quién es más probable que se olvide del cumpleaños de su mejor amigo?",
"¿Quién es más probable que acabe cantando en un coche con desconocidos?",
"¿Quién es más probable que compre algo inútil en una teletienda?",
"¿Quién es más probable que se quede encerrado en su propia casa?",
"¿Quién es más probable que gane un concurso de comer?",
"¿Quién es más probable que ponga la música más vergonzosa?",
"¿Quién es más probable que se haga amigo del camarero?",
"¿Quién es más probable que llore viendo un anuncio?",
"¿Quién es más probable que tenga 300 pestañas abiertas en el móvil?",
"¿Quién es más probable que se enfade jugando a un juego de mesa?"
],
fuerte:[
"¿Quién es más probable que se líe con alguien esta noche?",
"¿Quién es más probable que le escriba a su ex borracho?",
"¿Quién es más probable que se líe con el amigo de un amigo?",
"¿Quién es más probable que tenga un rollo de una noche del que se arrepiente?",
"¿Quién es más probable que sea infiel?",
"¿Quién es más probable que acabe llorando en el baño?",
"¿Quién es más probable que se líe con alguien de esta fiesta antes de que acabe?",
"¿Quién es más probable que tenga la app de citas más activa?",
"¿Quién es más probable que mande una foto de la que luego se arrepienta?",
"¿Quién es más probable que tenga un secreto que nadie sospecha?",
"¿Quién es más probable que bese a alguien por una apuesta?",
"¿Quién es más probable que se líe con un compañero de trabajo?",
"¿Quién es más probable que se líe con un ex de un amigo?",
"¿Quién es más probable que acabe la noche en la cama de otra persona?",
"¿Quién es más probable que sea el más ligón de la fiesta?",
"¿Quién es más probable que tenga más ex de los que admite?",
"¿Quién es más probable que haga un baile sensual sin que se lo pidan?",
"¿Quién es más probable que se despierte sin saber dónde está?",
"¿Quién es más probable que beba de más y no recuerde nada?",
"¿Quién es más probable que le robe la pareja a un amigo?",
"¿Quién es más probable que tenga un crush con alguien de aquí?",
"¿Quién es más probable que mienta en una cita sobre su edad o su trabajo?",
"¿Quién es más probable que se haya enamorado de alguien prohibido?",
"¿Quién es más probable que vaya a un club de striptease?",
"¿Quién es más probable que tenga el historial de búsqueda más turbio?",
"¿Quién es más probable que se líe con alguien y no recuerde su nombre?",
"¿Quién es más probable que haga un trío?",
"¿Quién es más probable que bese a dos personas la misma noche?",
"¿Quién es más probable que acabe borracho pidiendo perdón a todos?",
"¿Quién es más probable que cotillee los mensajes de su pareja?"
]
};
// ---------- Utilidades ----------
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const pid=ls.get('pid')||(()=>{const p=Math.random().toString(36).slice(2,10);ls.set('pid',p);return p})();
const OPTS={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'},{urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'},{urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turns:openrelay.metered.ca:443'],username:'openrelayproject',credential:'openrelayproject'}]}};
let wl;async function keepAwake(){try{if(navigator.wakeLock&&document.visibilityState==='visible')wl=await navigator.wakeLock.request('screen')}catch(e){}}
let myName=ls.get('name')||'',isHost=false,code='',peer,conn,conns={},H=null,S=null,me=null,myVote=null,err='',cq='',deck=[],busy=false;
const hashCode=()=>(location.hash||'').replace('#','').toUpperCase().slice(0,4);

// ---------- Anfitrión ----------
function createGame(mode){
  if(typeof Peer==='undefined'){err='No se pudo cargar PeerJS (¿sin internet o bloqueado?).';return render()}
  isHost=true;busy=true;err='';render();keepAwake();
  const c=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
  peer=new Peer('hq-'+c,OPTS);
  peer.on('open',()=>{code=c;busy=false;H={mode:mode,phase:'lobby',round:0,q:'',votes:{},res:null,players:[{id:pid,n:1,name:myName,total:0}]};me=1;bc()});
  peer.on('disconnected',()=>{try{if(!peer.destroyed)peer.reconnect()}catch(e){}});
  peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();createGame(mode)}else if(!H){busy=false;isHost=false;err='No se pudo crear la partida ['+e.type+']. Revisa tu conexión.';render()}});
  peer.on('connection',c=>{
    c.on('data',m=>{
      if(m.t==='join'&&m.pid){
        let p=H.players.find(x=>x.id===m.pid);
        if(!p){p={id:m.pid,n:H.players.length+1,name:String(m.name||'?').slice(0,14),total:0};H.players.push(p)}
        conns[m.pid]=c;c._pid=m.pid;bc();
      }else if(m.t==='vote'&&H.phase==='vote'&&c._pid&&H.players.some(p=>p.n===m.n)){const v=H.players.find(x=>x.id===c._pid);if(v&&v.n!==m.n){H.votes[c._pid]=m.n;bc()}}
    });
  });
}
const pub=()=>({mode:H.mode,phase:H.phase,round:H.round,q:H.q,res:H.res,code,voted:Object.keys(H.votes).length,players:H.players.map(p=>({n:p.n,name:p.name,total:p.total}))});
function bc(){S=pub();for(const id in conns){const c=conns[id];if(c&&c.open){const p=H.players.find(x=>x.id===id);c.send({t:'s',s:S,you:p&&p.n,voted:(H.votes[id]!=null?H.votes[id]:null)})}}myVote=H.votes[pid]!=null?H.votes[pid]:null;render()}
function nextQ(){
  if(!deck.length)deck=Q[H.mode].map(q=>[Math.random(),q]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  H.q=cq.trim()||deck.pop();cq='';H.round++;H.votes={};H.res=null;H.phase='vote';bc();
}
function reveal(){
  const counts={};Object.values(H.votes).forEach(n=>counts[n]=(counts[n]||0)+1);
  const max=Math.max(0,...Object.values(counts));
  H.players.forEach(p=>p.total+=counts[p.n]||0);
  H.res={counts,max,winners:max?H.players.filter(p=>counts[p.n]===max).map(p=>p.n):[]};
  H.phase='result';bc();
}

// ---------- Jugador ----------
let stage='';
function setStage(t){stage=t;if(busy&&!S)render()}
function joinGame(c,retry){
  if(typeof Peer==='undefined'){err='No se pudo cargar PeerJS (¿sin internet o bloqueado?).';return render()}
  code=c;busy=true;err='';stage='1/3 servidor';render();keepAwake();
  try{peer&&peer.destroy()}catch(e){}
  let opened=false,done=false,to;
  const fail=async()=>{
    if(done)return;done=true;
    if(S){setTimeout(()=>joinGame(c),3000);return}
    if(!retry&&!opened){return joinGame(c,true)}
    let reach='no';try{await fetch('https://0.peerjs.com/',{mode:'no-cors',cache:'no-store'});reach='sí'}catch(e){}
    const st=conn&&conn.peerConnection?conn.peerConnection.iceConnectionState:'-';
    err=opened?'Llego al servidor pero no al anfitrión ['+st+']. Prueba con otra red (datos o wifi).':'No llego al servidor de conexión [servidor accesible: '+reach+']. Abre el enlace en Chrome y desactiva DNS privado o bloqueadores.';
    busy=false;render();
  };
  to=setTimeout(fail,9000);
  peer=new Peer(OPTS);
  peer.on('open',()=>{
    opened=true;setStage('2/3 buscando partida');
    conn=peer.connect('hq-'+code,{reliable:true});
    conn.on('open',()=>{setStage('3/3 entrando');conn.send({t:'join',pid,name:myName})});
    conn.on('data',m=>{if(m.t==='s'){clearTimeout(to);done=true;busy=false;S=m.s;me=m.you;myVote=m.voted;render()}});
    conn.on('close',()=>{if(S&&!done)return;if(S)setTimeout(()=>joinGame(code),1500)});
  });
  peer.on('error',e=>{
    if(done)return;clearTimeout(to);done=true;
    if(S){setTimeout(()=>joinGame(c),3000);return}
    err=e.type==='peer-unavailable'?'No existe la partida '+code+'. Revisa el código.':'Problema de conexión ['+e.type+'].';busy=false;render();
  });
}
function vote(n){
  if(n===me)return;
  if(isHost){if(H.phase==='vote'){H.votes[pid]=n;bc()}}
  else if(conn&&conn.open){conn.send({t:'vote',n});myVote=n;render()}
}

// ---------- Pantallas ----------
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
let lastKey='';
function enter(k){app.classList.toggle('enter',k!==lastKey);lastKey=k}
function burst(list){if(RM)return;for(let i=0;i<26;i++){const e=document.createElement('span');e.className='fx';e.textContent=list[i%list.length];e.style.left=Math.random()*96+'vw';e.style.animationDelay=Math.random()*.9+'s';e.style.fontSize=(22+Math.random()*18)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),4200)}}
(function(){const bg=$('#bg'),em=['🎃','👻','🦇','💀','🕸️','🕯️'];for(let i=0;i<14;i++){const e=document.createElement('i');e.textContent=em[i%em.length];e.style.left=(i*7.3+Math.random()*5)%96+'vw';e.style.fontSize=(24+Math.random()*26)+'px';e.style.animationDuration=(14+Math.random()*14)+'s';e.style.animationDelay=(-Math.random()*20)+'s';bg.appendChild(e)}})();
function render(){
  if(!S){
    const hc=hashCode();
    app.innerHTML=`<h1>¿Quién es más <b>probable</b>?</h1><p class="sub">El juego de Halloween. Cada uno vota desde su móvil.</p>
    <input id="nm" placeholder="Tu nombre" maxlength="14" value="${esc(myName)}" autocomplete="off">
    ${busy?`<p class="mute">Conectando… ${esc(stage)}</p>`:hc.length===4
      ?`<button class="pri" data-a="join" data-c="${esc(hc)}">Unirme a la partida ${esc(hc)}</button>`
      :`<button class="pri" data-a="create" data-m="colegueo">😄 Crear partida · Colegueo</button><button class="pri" data-a="create" data-m="fuerte">🌶️ Crear partida · Fuerte (+18)</button><div class="or">o entra con un código</div><div class="row"><input id="cd" maxlength="4" placeholder="CÓDIGO" autocomplete="off"><button data-a="join">Unirme</button></div>`}
    <p class="err">${esc(err)}</p>`;
    document.body.dataset.mode='';enter('home'+busy+err);
    return;
  }
  const ps=S.players,total=ps.length,you=ps.find(p=>p.n===me);
  const chips=ps.map(p=>`<span class="chip"><b>${p.n}</b>${esc(p.name)}${p.n===me?' (tú)':''}</span>`).join('');
  let h=`<div class="top"><span>${S.round?'Ronda '+S.round:'Sala de espera'}</span><span class="chip">${S.mode==='fuerte'?'🌶️ Fuerte':'😄 Colegueo'} · ${S.code}</span></div>`;
  document.body.dataset.mode=S.mode||'';
  if(S.phase==='lobby'){
    const url=location.href.split('#')[0]+'#'+S.code;
    h+=`<h1>Tu número es el <b>${me||'…'}</b></h1>`;
    if(isHost){
      let q='';try{const g=qrcode(0,'M');g.addData(url);g.make();q=g.createSvgTag({cellSize:4,margin:1,scalable:true})}catch(e){}
      h+=`<p class="sub">Que escaneen el QR o entren con el código:</p>${q?`<div class="qr">${q}</div>`:''}<div class="code">${S.code}</div>
      <p class="mute" style="text-align:center;word-break:break-all">${esc(url)}</p>`;
    }else h+=`<p class="sub">Esperando a que el anfitrión empiece…</p>`;
    h+=`<div class="players">${chips}</div>`;
    if(isHost)h+=`<button class="pri" data-a="next" ${total<2?'disabled':''}>Empezar (${total} jugadores)</button>`;
  }else if(S.phase==='vote'){
    h+=`<div class="q">${esc(S.q)}</div><div class="grid">${ps.map(p=>`<button class="opt ${myVote===p.n?'on':''}" data-a="vote" data-n="${p.n}" ${p.n===me?'disabled':''}><span class="n">${p.n}</span><span>${esc(p.name)}${p.n===me?' (tú)':''}</span></button>`).join('')}</div>
    <p class="mute" style="text-align:center">${myVote?'Voto enviado. Puedes cambiarlo hasta que se revele.':'Toca el número de quien creas que es (a ti mismo no puedes votarte).'}<br>${S.voted} de ${total} han votado</p>`;
    if(isHost)h+=`<button class="pri" data-a="reveal">Revelar resultados</button>`;
  }else if(S.phase==='result'){
    const r=S.res,names=n=>esc((ps.find(p=>p.n===n)||{}).name||'');
    const sorted=[...ps].sort((a,b)=>(r.counts[b.n]||0)-(r.counts[a.n]||0));
    h+=`<div class="mute">${esc(S.q)}</div>`;
    h+=r.max?`<div class="win"><div class="big">${r.winners.map(n=>n+' · '+names(n)).join('<br>')}</div>${r.winners.length>1?'Empate':'Gana'} con ${r.max} ${r.max>1?'votos':'voto'}</div>`:`<div class="win"><div class="big">Nadie votó</div></div>`;
    h+=sorted.map(p=>{const v=r.counts[p.n]||0;return`<div class="bar"><span class="badge">${p.n}</span><div class="t"><div class="f" style="width:${r.max?v/r.max*100:0}%"></div><span>${esc(p.name)}</span></div><span class="v">${v}</span></div>`}).join('');
    if(isHost)h+=`<input id="cq" placeholder="Tu propia pregunta (opcional)" value="${esc(cq)}" style="margin-top:18px"><button class="pri" data-a="next">Siguiente pregunta</button><button data-a="rank">Ver ranking</button>`;
    else h+=`<p class="mute" style="text-align:center">Esperando la siguiente pregunta…</p>`;
  }else{
    h+=`<h1>Ranking</h1><p class="sub">Votos recibidos en toda la partida</p>`;
    h+=[...ps].sort((a,b)=>b.total-a.total).map(p=>`<div class="rank"><span class="badge">${p.n}</span><span>${esc(p.name)}</span><span class="badge">${p.total}</span></div>`).join('');
    if(isHost)h+=`<button class="pri" data-a="next" style="margin-top:16px">Seguir jugando</button>`;
  }
  app.innerHTML=h;
  const k=S.phase+S.round;
  enter(k);
  if(S.phase==='result'&&k!==lastBurst){lastBurst=k;burst(['🎃','👻','🦇','💀'])}
}
let lastBurst='';
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,nm=$('#nm');
  if(nm){myName=nm.value.trim().slice(0,14);ls.set('name',myName)}
  if(a==='create'||a==='join'){
    if(!myName){err='Escribe tu nombre primero.';return render()}
    if(a==='create')return createGame(b.dataset.m);
    const c=(b.dataset.c||($('#cd')||{}).value||'').trim().toUpperCase();
    if(c.length!==4){err='El código tiene 4 letras.';return render()}
    return joinGame(c);
  }
  if(a==='vote')vote(+b.dataset.n);
  else if(!isHost)return;
  else if(a==='next')nextQ();
  else if(a==='reveal')reveal();
  else if(a==='rank'){H.phase='end';bc()}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;keepAwake();if(isHost){if(peer&&peer.disconnected&&!peer.destroyed)try{peer.reconnect()}catch(e){}}else if(S&&(!conn||!conn.open))joinGame(code)});
app.addEventListener('input',e=>{if(e.target.id==='cq')cq=e.target.value});
render();
</script>
</body>
</html>
